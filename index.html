<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>वाजे परिवार दिनविशेष</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "a81aad78-0bb6-4bd5-8dcd-e401d6d3f358",
    });
  });
</script>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#a76302">

</head>
<body>

<div class="container">

  <h1>🎉 वाजे परिवार दिनविशेष</h1>

  <form id="reminderForm">

    <input
      type="text"
      id="name"
      placeholder="Name"
      required
    >

    <input
      type="date"
      id="date"
      required
    >

   <select id="type" required>
  <option value="Birthday">🎂 Birthday</option>
  <option value="Anniversary">💍 Anniversary</option>
  <option value="Death Anniversary">🙏 Death Anniversary</option> <option value="Special Day">⭐ Special Day</option>
</select>

    <input
      type="text"
      id="phone"
      placeholder="Phone Number"
    >

    <textarea
      id="notes"
      placeholder="Notes"
    ></textarea>

    <button type="submit">
      Save Reminder
    </button>

  </form>

  <h2>Upcoming Events</h2>

  <div id="reminderList"></div>

</div>

<script src="script.js"></script>

</body>
</html>
